<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- Configuração ----------
const GAME_TIME = 120;
const MAX_CUSTOMERS = 8;
const MAX_CARS = 10;
const PLAYER_SPEED = 4.5;
const PLAYER_RADIUS = 0.4;
const ARREST_DISTANCE = 3;
const DESK = { x: -27, z: -5 };
const CHECKOUT = { x: -14, z: -6 };
const DOOR = { x: 0, z: 20 };
const CORRIDOR_Z = 15;
const SHELF_X = [-10, 0, 10];
const SHIRTS = [0x00bcd4, 0x76ff03, 0xff6d00, 0xd500f9, 0xffea00];
const CAR_COLORS = [0xff1744, 0x2979ff, 0xffea00, 0x00e676, 0xff9100];
const GUARD_COLORS = [0x1e88e5, 0xe53935, 0x43a047, 0xfb8c00, 0x8e24aa, 0x00acc1];
const LANE_EAST = 28, LANE_WEST = 31;
const STOP_EAST = -16, STOP_WEST = -8;
const TURN_X = 30, GARAGE_DOOR_Z = 12;
const CAMERAS = [
  { name: 'Câmera 1 – Setor Noroeste', x: -18, z: -18, tx: 6, tz: 6 },
  { name: 'Câmera 2 – Setor Nordeste', x: 18, z: -18, tx: -6, tz: 6 },
  { name: 'Câmera 3 – Setor Sudoeste', x: -18, z: 18, tx: 6, tz: -6 },
  { name: 'Câmera 4 – Setor Sudeste', x: 18, z: 18, tx: -6, tz: -6 },
];
const WALL = 0xfff8e1, ROOM = 0xb3e5fc;
const MODEL_NAMES = ['guard', 'customer', 'car', 'shelf', 'counter', 'console', 'doorsensor', 'platecam', 'trafficlight', 'seccam', 'bush'];

const DEFAULT_INFRACOES = [{ codigo: '001', nome: 'Furto de mercadoria', descricao: 'Item retirado da prateleira e ocultado sem pagamento.' }];
let infracoes = DEFAULT_INFRACOES;
fetch('/api/infracoes').then(r => (r.ok ? r.json() : null)).then(d => { if (Array.isArray(d) && d.length) infracoes = d; }).catch(() => {});

// ---------- Rede ----------
const socket = io();
const net = { codigo: '', isHost: false, jogadores: [], id: '' };
let sessaoId = '';
let modelsReady = false;
let state = 'menu';            // menu | lobby | playing | over
let scores = {};               // (anfitrião) pontuação por jogador
let placar = [];               // (convidados) placar vindo do anfitrião
const posicoes = {};           // (anfitrião) posição de cada guarda
const remotos = new Map();     // outros guardas: id -> {p, x, z, tx, tz, yaw}
const remotosClientes = new Map(); // (convidados) clientes: id -> registro
const remotosCarros = new Map();   // (convidados) carros: id -> registro
const fotos = [];

function emitir(tipo, dados = {}) {
  if (socket.connected) socket.emit('evento', { tipo, ...dados });
}

// ---------- Renderer / cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x81d4fa);
scene.fog = new THREE.Fog(0x81d4fa, 70, 160);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(12, 40, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 120 });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);

// Materiais trocados em tempo de jogo (telas, LEDs, lâmpadas, feixe)
const screenMats = [0, 1, 2, 3].map(() => new THREE.MeshBasicMaterial({ color: 0x101820 }));
const doorLedMats = [];
const lampMats = [];
const doorBeamMat = new THREE.MeshBasicMaterial({ color: 0xff1744 });
let doorBeam = null;
let plateFlash = null;

// ---------- Utilitários ----------
const colliders = [];
function addBox(x, y, z, w, h, d, color, solid = true, cast = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.75 }));
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  scene.add(mesh);
  if (solid) addCollider(x, z, w, d);
  return mesh;
}
function addCollider(x, z, w, d) {
  colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
}
function resolveCollisions(o, r) {
  for (const b of colliders) {
    const cx = Math.max(b.minX, Math.min(o.x, b.maxX));
    const cz = Math.max(b.minZ, Math.min(o.z, b.maxZ));
    const dx = o.x - cx, dz = o.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2), push = (r - d) / d;
        o.x += dx * push; o.z += dz * push;
      } else {
        const left = o.x - b.minX, right = b.maxX - o.x, up = o.z - b.minZ, down = b.maxZ - o.z;
        const m = Math.min(left, right, up, down);
        if (m === left) o.x = b.minX - r;
        else if (m === right) o.x = b.maxX + r;
        else if (m === up) o.z = b.minZ - r;
        else o.z = b.maxZ + r;
      }
    }
  }
}

// ---------- Modelos (Blender -> GLB, só cubos) ----------
const templates = {};
function instantiate(name, cloneMats = true) {
  const g = templates[name].clone(true);
  g.traverse((o) => {
    if (!o.isMesh) return;
    if (cloneMats) o.material = o.material.clone();
    o.castShadow = true;
    o.receiveShadow = true;
  });
  return g;
}
function placeModel(name, x, y, z, ry = 0) {
  const g = instantiate(name, false);
  g.position.set(x, y, z);
  g.rotation.y = ry;
  scene.add(g);
  return g;
}
function paintPart(group, matName, hex) {
  group.traverse((o) => {
    if (o.isMesh && o.material.name === matName) o.material.color.setHex(hex);
  });
}
function rigLimbs(root) {
  root.updateMatrixWorld(true);
  const groups = { LegL: [], LegR: [], ArmL: [], ArmR: [] };
  root.traverse((o) => {
    if (!o.isMesh) return;
    for (const key of Object.keys(groups)) {
      if (o.name === key || o.name.startsWith(key + '_')) groups[key].push(o);
    }
  });
  for (const [key, meshes] of Object.entries(groups)) {
    if (!meshes.length) continue;
    const box = new THREE.Box3();
    meshes.forEach((m) => box.expandByObject(m));
    const parent = meshes[0].parent;
    const top = new THREE.Vector3((box.min.x + box.max.x) / 2, box.max.y, (box.min.z + box.max.z) / 2);
    const pivot = new THREE.Group();
    pivot.name = key + '_pivot';
    parent.add(pivot);
    pivot.position.copy(parent.worldToLocal(top));
    pivot.updateMatrixWorld(true);
    meshes.forEach((m) => pivot.attach(m));
  }
}
function buildPerson(kind, shirtColor = 0x00bcd4) {
  const group = instantiate(kind);
  paintPart(group, 'Shirt', shirtColor);
  const limbs = {
    legL: group.getObjectByName('LegL_pivot'), legR: group.getObjectByName('LegR_pivot'),
    armL: group.getObjectByName('ArmL_pivot'), armR: group.getObjectByName('ArmR_pivot'),
  };
  const bulge = group.getObjectByName('Bulge');
  const marker = group.getObjectByName('Marker');
  if (bulge) bulge.visible = false;
  if (marker) marker.visible = false;
  return {
    group, limbs, bag: group.getObjectByName('Bag'), bulge, marker,
    amount: 0, phase: 0, targetYaw: 0, rate: 0,
  };
}
function poseLimbs(o, phase, amount) {
  const s = Math.sin(phase) * amount;
  o.limbs.legL.rotation.x = s;
  o.limbs.legR.rotation.x = -s;
  o.limbs.armL.rotation.x = -s * 0.7;
  o.limbs.armR.rotation.x = s * 0.7;
}
function animateWalk(o, moving, dt) {
  const target = moving ? 0.6 : 0;
  o.amount += (target - o.amount) * Math.min(1, dt * 10);
  if (moving) o.phase += dt * o.rate;
  poseLimbs(o, o.phase, o.amount);
  const diff = Math.atan2(Math.sin(o.targetYaw - o.group.rotation.y), Math.cos(o.targetYaw - o.group.rotation.y));
  o.group.rotation.y += diff * Math.min(1, dt * 10);
  o.group.position.y = Math.abs(Math.sin(o.phase * 2)) * 0.06 * (o.amount / 0.6);
}

// ---------- Mundo ----------
function buildWorld() {
  addBox(0, -0.05, 0, 300, 0.1, 300, 0x66bb6a, false, false);
  addBox(0, 0.05, 0, 40, 0.1, 40, 0xffecb3, false, false);
  for (let i = -18; i <= 18; i += 4) {
    addBox(i, 0.1, 0, 0.08, 0.02, 40, 0xffd54f, false, false);
    addBox(0, 0.1, i, 40, 0.02, 0.08, 0xffd54f, false, false);
  }
  addBox(0, 0.08, 18, 4, 0.03, 3, 0x8d6e63, false, false);

  addBox(0, 2, -20.25, 40.5, 4, 0.5, WALL);
  addBox(20.25, 2, 0, 0.5, 4, 40.5, WALL);
  addBox(-20.25, 2, -11, 0.5, 4, 18, WALL);
  addBox(-20.25, 2, 11, 0.5, 4, 18, WALL);
  addBox(-11, 2, 20.25, 18, 4, 0.5, WALL);
  addBox(11, 2, 20.25, 18, 4, 0.5, WALL);
  addBox(0, 3.5, 20.25, 4, 1, 0.5, WALL, false);
  addBox(0, 4.2, 20.25, 40, 0.3, 0.6, 0xff7043, false);
  addBox(0, 4.2, -20.25, 40, 0.3, 0.6, 0xff7043, false);

  addBox(-27, 2, -8.25, 10.5, 4, 0.5, ROOM);
  addBox(-27, 2, 8.25, 10.5, 4, 0.5, ROOM);
  addBox(-32.25, 2, 0, 0.5, 4, 16.5, ROOM);
  addBox(-22.25, 2, -5, 0.5, 4, 6, ROOM);
  addBox(-22.25, 2, 5, 0.5, 4, 6, ROOM);
  addBox(-27, 0.05, 0, 10, 0.1, 16, 0xffe0b2, false, false);
  addBox(-21, 0.05, 0, 2.2, 0.1, 4.2, 0xffe0b2, false, false);

  const consoleObj = placeModel('console', DESK.x, 0, DESK.z, 0);
  addCollider(DESK.x, DESK.z, 4, 1.5);
  for (let i = 0; i < 4; i++) consoleObj.getObjectByName('Screen' + i).material = screenMats[i];

  for (const sx of SHELF_X) {
    placeModel('shelf', sx, 0, 0, 0);
    addCollider(sx, 0, 1.2, 22);
  }

  placeModel('counter', -16.5, 0, -6, 0);
  addCollider(-16.5, -6, 1.8, 4);

  for (const cam of CAMERAS) {
    placeModel('seccam', cam.x, 0, cam.z, Math.atan2(cam.tx - cam.x, cam.tz - cam.z));
  }

  for (const sx of [-2.2, 2.2]) {
    const ds = placeModel('doorsensor', sx, 0, DOOR.z + 0.25, 0);
    const m = new THREE.MeshBasicMaterial({ color: 0x00e676 });
    ds.getObjectByName('LED').material = m;
    doorLedMats.push(m);
  }
  doorBeam = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.05, 0.05), doorBeamMat);
  doorBeam.position.set(0, 1.0, DOOR.z + 0.25);
  scene.add(doorBeam);

  addBox(0, 0.05, 29, 110, 0.1, 10, 0x546e7a, false, false);
  for (let x = -50; x <= 50; x += 6) addBox(x, 0.12, 29.5, 3, 0.05, 0.2, 0xffffff, false, false);
  addBox(0, 0.06, 22, 110, 0.12, 4, 0xffe082, false, false);
  addBox(-16, 0.13, 29.5, 0.4, 0.05, 7, 0xffffff, false, false);
  addBox(-8, 0.13, 29.5, 0.4, 0.05, 7, 0xffffff, false, false);
  const tl = placeModel('trafficlight', -12, 0, 23.5, 0);
  for (const [name, key, bright] of [['LampRed', 'red', 0xff3b30], ['LampYellow', 'yellow', 0xffcc00], ['LampGreen', 'green', 0x34c759]]) {
    const m = new THREE.MeshBasicMaterial({ color: 0x333333 });
    tl.getObjectByName(name).material = m;
    lampMats.push({ name: key, bright, mat: m });
  }

  addBox(0, 0.05, -30, 110, 0.1, 8, 0x546e7a, false, false);
  addBox(-40, 0.05, 0, 8, 0.1, 68, 0x546e7a, false, false);
  addBox(42, 0.05, 0, 8, 0.1, 68, 0x546e7a, false, false);

  addBox(29, 2.25, 2, 10, 4.5, 20, 0xff7043);
  for (const z of [-6, -2, 2, 6]) addBox(34.05, 2.6, z, 0.1, 1.0, 1.4, 0x81d4fa, false, false);
  addBox(29, 4.9, 11.9, 8, 0.7, 0.2, 0xffea00, false, false);
  addBox(30, 0.06, 18, 6, 0.1, 12, 0x546e7a, false, false);
  addBox(30, 1.5, 12.1, 4, 3, 0.2, 0xffb300, false);

  placeModel('platecam', 26.2, 0, 23.6, Math.PI / 2);
  plateFlash = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  plateFlash.position.set(27.6, 4.8, 23.6);
  plateFlash.visible = false;
  scene.add(plateFlash);

  for (let i = 0; i < 14; i++) {
    const x = (Math.random() < 0.5 ? -1 : 1) * (50 + Math.random() * 8);
    const z = -45 + Math.random() * 90;
    placeModel('bush', x, 0, z, Math.random() * Math.PI * 2);
  }
}

// ---------- Semáforo ----------
let lightT = 0, lightState = 'green';
function updateLight(dt) {
  if (net.isHost) {
    lightT = (lightT + dt) % 14;
    lightState = lightT < 6 ? 'green' : lightT < 8 ? 'yellow' : 'red';
  }
  for (const l of lampMats) l.mat.color.setHex(l.name === lightState ? l.bright : 0x333333);
}

// ---------- Carros ----------
const cars = [];
let carSpawnTimer = 0, carSeq = 0;
function makeCar(color) {
  const g = instantiate('car');
  paintPart(g, 'Body', color);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.5), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  plate.position.set(-1.22, 0.7, 0);
  g.add(plate);
  return g;
}
function spawnCar() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const cor = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
  const g = makeCar(cor);
  const car = {
    id: ++carSeq, cor, g, dir,
    x: dir > 0 ? -55 : 55,
    z: dir > 0 ? LANE_EAST : LANE_WEST,
    v: 6 + Math.random() * 3,
    cruise: 6 + Math.random() * 3,
    turnIn: dir > 0 && Math.random() < 0.35,
    turning: false,
    plate: null,
  };
  g.position.set(car.x, 0, car.z);
  g.rotation.y = dir > 0 ? 0 : Math.PI;
  scene.add(g);
  cars.push(car);
}
function removeCar(car) {
  scene.remove(car.g);
  const i = cars.indexOf(car);
  if (i >= 0) cars.splice(i, 1);
}
function updateCars(dt) {
  for (const car of [...cars]) {
    let target = car.cruise;
    if (!car.turning) {
      if (lightState === 'red') {
        const sl = car.dir > 0 ? STOP_EAST : STOP_WEST;
        const front = car.x + car.dir * 1.2;
        const dist = (sl - front) * car.dir;
        if (dist >= 0 && dist < 3) target = 0;
      }
      for (const other of cars) {
        if (other === car || other.turning || other.dir !== car.dir || Math.abs(other.z - car.z) > 0.1) continue;
        const gap = (other.x - car.x) * car.dir;
        if (gap > 0 && gap < 3.2) target = 0;
      }
    }
    car.v += (target - car.v) * Math.min(1, dt * 3);
    if (car.turning) {
      car.z -= 6 * dt;
      if (car.z <= GARAGE_DOOR_Z) { removeCar(car); continue; }
    } else {
      car.x += car.dir * car.v * dt;
      if (car.turnIn && car.dir > 0 && car.x >= TURN_X - 0.5) {
        car.turning = true;
        car.x = TURN_X;
        car.g.rotation.y = Math.PI / 2;
        photographPlate(car);
      }
      if (car.x > 60 || car.x < -60) { removeCar(car); continue; }
    }
    car.g.position.set(car.x, 0, car.z);
  }
}

// ---------- Jogador local (seu guarda) ----------
const player = { x: -27, z: 0, yaw: Math.PI };
let playerView = null;

// ---------- Clientes (simulados pelo anfitrião) ----------
const customers = [];
let spawnTimer = 0, customerSeq = 0;

function randomShelfSpot() {
  const sx = SHELF_X[Math.floor(Math.random() * SHELF_X.length)];
  return { x: sx + (Math.random() < 0.5 ? -1.6 : 1.6), z: -9 + Math.random() * 18 };
}
function shelfRouteFrom(x, z) {
  const s = randomShelfSpot();
  return [{ x, z: CORRIDOR_Z }, { x: s.x, z: CORRIDOR_Z }, s];
}
function checkoutRouteFrom(x, z) {
  return [{ x, z: CORRIDOR_Z }, { x: CHECKOUT.x, z: CORRIDOR_Z }, { x: CHECKOUT.x, z: CHECKOUT.z }];
}
function exitRouteFrom(x, z) {
  return [{ x, z: CORRIDOR_Z }, { x: DOOR.x, z: CORRIDOR_Z }, { x: DOOR.x, z: DOOR.z + 2 }];
}
function spawnCustomer() {
  const thief = Math.random() < 0.3;
  const shirt = thief ? 0x212121 : SHIRTS[Math.floor(Math.random() * SHIRTS.length)];
  const p = buildPerson('customer', shirt);
  p.bag.visible = !thief;
  const c = {
    ...p, id: ++customerSeq, shirtColor: shirt, wasInside: false, thief, stolen: false, checked: false, visits: 0,
    state: 'walk', after: 'browse', path: [], timer: 0, walkTime: 0, browseTime: 0,
    speed: thief ? 2.0 : 1.5, rate: thief ? 5.2 : 3.9, x: DOOR.x, z: DOOR.z + 2,
  };
  c.path = shelfRouteFrom(c.x, c.z);
  c.group.position.set(c.x, 0, c.z);
  scene.add(c.group);
  customers.push(c);
}
function removeCustomer(c) {
  scene.remove(c.group);
  const i = customers.indexOf(c);
  if (i >= 0) customers.splice(i, 1);
}
function walkTo(c, path, after) {
  c.path = path;
  c.after = after;
  c.state = 'walk';
  c.walkTime = 0;
}
function enterState(c, st) {
  c.state = st;
  c.timer = 0;
  if (st === 'browse') c.browseTime = 1.5 + Math.random() * 2.5;
  if (st === 'pay') registrarVenda(c);
  if (st === 'gone') {
    if (c.thief && c.stolen) registrarFuga(c);
    removeCustomer(c);
  }
}
function moveTowards(c, tx, tz, dt) {
  const dx = tx - c.x, dz = tz - c.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.2) return true;
  const step = Math.min(d, c.speed * dt);
  c.x += (dx / d) * step;
  c.z += (dz / d) * step;
  resolveCollisions(c, 0.4);
  c.targetYaw = Math.atan2(dx, dz);
  return false;
}
function finishBrowse(c) {
  c.visits++;
  if (c.thief && !c.stolen && Math.random() < 0.8) {
    c.stolen = true;
    c.bulge.visible = true;
  }
  if (c.visits < 2) walkTo(c, shelfRouteFrom(c.x, c.z), 'browse');
  else if (c.thief && c.stolen) walkTo(c, exitRouteFrom(c.x, c.z), 'gone');
  else walkTo(c, checkoutRouteFrom(c.x, c.z), 'pay');
}
function updateCustomer(c, dt) {
  c.timer += dt;
  if (c.state === 'walk') {
    c.walkTime += dt;
    if (c.walkTime > 40) { removeCustomer(c); return; }
    if (c.path.length) {
      const wp = c.path[0];
      if (moveTowards(c, wp.x, wp.z, dt)) c.path.shift();
    }
    if (c.path.length === 0) enterState(c, c.after);
  } else if (c.state === 'browse') {
    if (c.timer >= c.browseTime) finishBrowse(c);
  } else if (c.state === 'pay') {
    if (c.timer >= 2) walkTo(c, exitRouteFrom(c.x, c.z), 'gone');
  } else if (c.state === 'caught') {
    if (c.timer >= 2) removeCustomer(c);
  }
  if (c.state !== 'caught') c.marker.visible = monitorMode && c.stolen;
  c.group.position.set(c.x, 0, c.z);
  checkDoor(c);
  animateWalk(c, c.state === 'walk', dt);
}

// ---------- Abordagem ----------
// Convidado: pede ao anfitrião. Anfitrião: resolve direto.
function tentarAbordar() {
  const lista = net.isHost ? customers : [...remotosClientes.values()];
  let alvo = null, best = ARREST_DISTANCE;
  for (const c of lista) {
    if (c.state === 'caught' || c.state === 'gone') continue;
    const d = Math.hypot(c.x - player.x, c.z - player.z);
    if (d < best) { best = d; alvo = c; }
  }
  if (!alvo) return showMsg('Nenhum cliente por perto.', 1500);
  if (net.isHost) abordar(net.id, alvo.id);
  else socket.emit('acao', { tipo: 'abordar', alvo: alvo.id });
}
function avisar(quemId, texto, ms = 2500) {
  if (quemId === net.id) showMsg(texto, ms);
  else emitir('msg', { para: quemId, texto, ms });
}
function abordar(quemId, alvoId) {
  const c = customers.find((x) => x.id === alvoId);
  if (!c || c.state === 'caught' || c.state === 'gone') return;
  const pos = quemId === net.id ? player : posicoes[quemId];
  if (!pos) return;
  if (Math.hypot(c.x - pos.x, c.z - pos.z) > ARREST_DISTANCE + 0.5) return avisar(quemId, 'Cliente longe demais.', 1500);
  const s = scores[quemId] || (scores[quemId] = { nome: '?', pontos: 0, furtos: 0, escapes: 0 });

  if (c.thief) {
    if (c.stolen) {
      s.pontos += 100;
      s.furtos++;
      const inf = infracoes[Math.floor(Math.random() * infracoes.length)];
      avisar(quemId, `✅ Furto detectado! +100 pts<br><b>Infração ${inf.codigo}: ${inf.nome}</b><br>${inf.descricao}`, 6000);
      registrar('bad', `#${c.id} · detido por furto (Inf. ${inf.codigo})`,
        { tipo: 'detido', cliente_id: c.id, observacao: `Infração ${inf.codigo}` });
      c.state = 'caught';
      c.timer = 0;
      c.path = [];
      paintPart(c.group, 'Shirt', 0xff1744);
      c.marker.visible = false;
    } else {
      s.pontos -= 20;
      avisar(quemId, 'Sem provas: este cliente não pegou nada. -20 pts', 3000);
    }
  } else {
    if (c.checked) return avisar(quemId, 'Este cliente já foi abordado.', 1500);
    c.checked = true;
    s.pontos -= 30;
    avisar(quemId, 'Cliente inocente abordado! Ele ficou irritado. -30 pts', 3000);
  }
}

// ---------- Sala de câmeras ----------
function nearDesk() {
  return Math.hypot(player.x - DESK.x, player.z - DESK.z) < 3;
}
function updateScreens() {
  screenMats.forEach((m, i) => {
    if (!monitorMode) m.color.setHex(0x101820);
    else m.color.setHex(i === camIndex ? 0x7fd8ff : 0x2a5a7a);
  });
}

// ---------- Movimento e câmera ----------
function updatePlayer(dt) {
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) s += 1;
  if (keys.KeyA || keys.ArrowLeft) s -= 1;
  const k = 1 / Math.SQRT2;
  let mx = k * f + k * s, mz = -k * f + k * s;
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    mx /= len; mz /= len;
    player.x += mx * PLAYER_SPEED * dt;
    player.z += mz * PLAYER_SPEED * dt;
    player.yaw = Math.atan2(mx, mz);
    resolveCollisions(player, PLAYER_RADIUS);
    player.x = Math.max(-60, Math.min(60, player.x));
    player.z = Math.max(-60, Math.min(60, player.z));
  }
  player.moving = len > 0;
  if (playerView) {
    playerView.group.position.x = player.x;
    playerView.group.position.z = player.z;
    playerView.targetYaw = player.yaw;
    animateWalk(playerView, len > 0, dt);
  }
}
let posTimer = 0;
function enviarPosicao(dt) {
  posTimer += dt;
  if (posTimer < 0.1) return;
  posTimer = 0;
  socket.emit('posicao', { x: player.x, z: player.z, yaw: player.yaw, moving: !!player.moving });
}
function updateCamera() {
  if (monitorMode) {
    const cam = CAMERAS[camIndex];
    camera.position.set(cam.x * 0.85, 3.6, cam.z * 0.85);
    camera.lookAt(cam.tx, 1.2, cam.tz);
    return;
  }
  camera.position.set(player.x - 17, 21, player.z + 17);
  camera.lookAt(player.x, 0.5, player.z);
}

// ---------- Teclado ----------
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (state !== 'playing') return;
  if (monitorMode) {
    if (e.code === 'KeyQ' || e.code === 'Escape') monitorMode = false;
    if (e.code === 'Digit1') camIndex = 0;
    if (e.code === 'Digit2') camIndex = 1;
    if (e.code === 'Digit3') camIndex = 2;
    if (e.code === 'Digit4') camIndex = 3;
    return;
  }
  if (e.code === 'KeyE' && !e.repeat) {
    if (nearDesk()) { monitorMode = true; camIndex = 0; }
    else tentarAbordar();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Caixa ----------
const caixaLog = document.getElementById('caixaLog');
const caixaTotal = document.getElementById('caixaTotal');
let salesCount = 0, salesTotal = 0, lostCount = 0;
const FORMAS_PAGTO = ['Dinheiro', 'Cartão', 'Pix'];
const formatBRL = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
function addRegistro(css, texto) {
  const div = document.createElement('div');
  div.className = 'reg ' + css;
  div.textContent = texto;
  caixaLog.prepend(div);
  while (caixaLog.children.length > 7) caixaLog.lastChild.remove();
}
function updateCaixaTotal() {
  caixaTotal.textContent = `Vendas: ${salesCount} · Total: ${formatBRL(salesTotal)} · Sem pagar: ${lostCount}`;
}
// Registra no caixa local e avisa os outros jogadores; payload vai para o banco (só anfitrião)
function registrar(css, texto, payload = null) {
  addRegistro(css, texto);
  emitir('caixa', { css, texto });
  if (payload) enviarDados('/api/caixa', payload);
}
function registrarVenda(c) {
  const itens = 1 + Math.floor(Math.random() * 6);
  let total = 0;
  for (let i = 0; i < itens; i++) total += 2 + Math.random() * 18;
  total = Math.round(total * 100) / 100;
  const forma = FORMAS_PAGTO[Math.floor(Math.random() * FORMAS_PAGTO.length)];
  salesCount++;
  salesTotal += total;
  registrar('ok', `#${c.id} · ${itens} ${itens > 1 ? 'itens' : 'item'} · ${formatBRL(total)} · ${forma}`,
    { tipo: 'venda', cliente_id: c.id, itens, total, forma_pagamento: forma });
  updateCaixaTotal();
}
function registrarFuga(c) {
  lostCount++;
  piscaPorta(0xffea00);
  for (const s of Object.values(scores)) s.pontos -= 40;
  registrar('bad', `#${c.id} · SAIU SEM PAGAR (furto)`, { tipo: 'sem_pagar', cliente_id: c.id, observacao: 'furto' });
  updateCaixaTotal();
  avisar(net.id, '🚨 Um furto escapou pela porta! A equipe perde 40 pts', 3000);
}
function resetCaixa() {
  salesCount = 0; salesTotal = 0; lostCount = 0;
  sensorStats.entradas = 0; sensorStats.saidas = 0; sensorStats.placas = 0;
  recentPlates.length = 0;

}

// Envio de dados ao banco (somente o anfitrião grava)
function enviarDados(url, corpo) {
  fetch(url, {
    method: 'POST',

    body: JSON.stringify({ sessao: sessaoId, ...corpo }),
  }).catch(() => {});
}

// ---------- Sensores ----------
const sensorStats = { entradas: 0, saidas: 0, placas: 0 };
const recentPlates = [];
let doorFlashT = 0, plateFlashT = 0;
const PLATE_LETTERS = 'ABCDEFGHIJKLMNOPRSTUVWXYZ';
const pick = (s) => s[Math.floor(Math.random() * s.length)];
const digit = () => String(Math.floor(Math.random() * 10));
const randomPlate = () => pick(PLATE_LETTERS) + pick(PLATE_LETTERS) + pick(PLATE_LETTERS) + digit() + pick(PLATE_LETTERS) + digit() + digit();

function flashDoor(hex) {
  doorBeamMat.color.setHex(hex);
  doorLedMats.forEach((m) => m.color.setHex(hex));
  doorFlashT = 0.6;
}
function piscaPorta(hex) {
  flashDoor(hex);
  emitir('porta', { cor: hex });
}
function checkDoor(c) {
  const inside = c.z < DOOR.z;
  if (inside !== c.wasInside) {
    if (Math.abs(c.x - DOOR.x) < 2.5 && Math.abs(c.z - DOOR.z) < 1.5) {
      if (inside) { sensorStats.entradas++; piscaPorta(0x00e676); }
      else { sensorStats.saidas++; piscaPorta(0x40c4ff); }
    }
    c.wasInside = inside;
  }
}
function piscaPlaca() {
  plateFlash.visible = true;
  plateFlashT = 0.25;
}
function photographPlate(car) {
  car.plate = randomPlate();
  sensorStats.placas++;
  recentPlates.unshift(`${car.plate} · ${new Date().toLocaleTimeString('pt-BR')}`);
  recentPlates.length = Math.min(recentPlates.length, 3);
  piscaPlaca();
  emitir('placa', { placa: car.plate });
  enviarDados('/api/placas', { placa: car.plate, capturada_em: new Date().toISOString() });
}
function updateFlashes(dt) {
  if (doorFlashT > 0) {
    doorFlashT -= dt;
    if (doorFlashT <= 0) {
      doorBeamMat.color.setHex(0xff1744);
      doorLedMats.forEach((m) => m.color.setHex(0x00e676));
    }
  }
  if (plateFlashT > 0) {
    plateFlashT -= dt;
    if (plateFlashT <= 0) plateFlash.visible = false;
  }
}

// ---------- Guardas e objetos dos outros jogadores ----------
function corDoJogador(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return GUARD_COLORS[h % GUARD_COLORS.length];
}
function criarRemoto(id, nome) {
  const p = buildPerson('guard', corDoJogador(id));
  p.rate = PLAYER_SPEED * 2.6;
  p.group.position.set(-27, 0, 0);
  scene.add(p.group);
  const r = { p, nome, x: -27, z: 0, tx: -27, tz: 0, yaw: 0 };
  remotos.set(id, r);
  return r;
}
function removerRemoto(id) {
  const r = remotos.get(id);
  if (r) { scene.remove(r.p.group); remotos.delete(id); }
  delete posicoes[id];
}
function atualizarPosicaoRemota(d) {
  if (!modelsReady) return;
  const r = remotos.get(d.id) || criarRemoto(d.id, (net.jogadores.find((j) => j.id === d.id) || {}).nome || 'Guarda');
  r.tx = d.x; r.tz = d.z; r.yaw = d.yaw;
  r.moving = d.moving;
  if (net.isHost) posicoes[d.id] = { x: d.x, z: d.z };
}
function criarClienteRemoto(item) {
  const p = buildPerson('customer', item.cor);
  p.bag.visible = !item.ladrao;
  p.rate = 3.9;
  p.group.position.set(item.x, 0, item.z);
  scene.add(p.group);
  return { id: item.id, p, x: item.x, z: item.z, tx: item.x, tz: item.z, yaw: item.yaw, state: item.st, ladrao: item.ladrao, furtou: item.furtou, pintado: false };
}
function aplicarSnapshot(s) {
  if (!modelsReady) return;
  placar = s.placar || [];
  salesCount = s.caixa.vendas; salesTotal = s.caixa.total; lostCount = s.caixa.perdidas;
  updateCaixaTotal();
  Object.assign(sensorStats, s.sensores);
  recentPlates.length = 0;
  recentPlates.push(...(s.placas || []));
  lightState = s.luz;
  timeLeft = s.tempo;

  const vistos = new Set();
  for (const item of s.clientes) {
    vistos.add(item.id);
    let r = remotosClientes.get(item.id);
    if (!r) { r = criarClienteRemoto(item); remotosClientes.set(item.id, r); }
    r.tx = item.x; r.tz = item.z; r.yaw = item.yaw; r.state = item.st; r.furtou = item.furtou; r.ladrao = item.ladrao;
    r.p.bulge.visible = item.furtou;
    if (item.st === 'caught' && !r.pintado) { paintPart(r.p.group, 'Shirt', 0xff1744); r.pintado = true; }
  }
  for (const [id, r] of remotosClientes) {
    if (!vistos.has(id)) { scene.remove(r.p.group); remotosClientes.delete(id); }
  }

  const carrosVistos = new Set();
  for (const item of s.carros) {
    carrosVistos.add(item.id);
    let r = remotosCarros.get(item.id);
    if (!r) {
      const g = makeCar(item.cor);
      scene.add(g);
      r = { g, x: item.x, z: item.z, tx: item.x, tz: item.z };
      remotosCarros.set(item.id, r);
    }
    r.tx = item.x; r.tz = item.z; r.dir = item.dir; r.virando = item.virando;
  }
  for (const [id, r] of remotosCarros) {
    if (!carrosVistos.has(id)) { scene.remove(r.g); remotosCarros.delete(id); }
  }
}
function montarSnapshot() {
  return {
    tempo: timeLeft,
    luz: lightState,
    placar: placarAtual(),
    caixa: { vendas: salesCount, total: salesTotal, perdidas: lostCount },
    sensores: { ...sensorStats },
    placas: [...recentPlates],
    clientes: customers.map((c) => ({
      id: c.id, x: c.x, z: c.z, yaw: c.targetYaw, st: c.state, furtou: c.stolen, ladrao: c.thief, cor: c.shirtColor,
    })),
    carros: cars.map((c) => ({ id: c.id, x: c.x, z: c.z, dir: c.dir, cor: c.cor, virando: c.turning })),
  };
}
// Atualiza posições e animações de todos os outros personagens (a cada quadro)
function atualizarRemotos(dt) {
  const k = Math.min(1, dt * 10);
  for (const r of remotos.values()) {
    const dx = r.tx - r.x, dz = r.tz - r.z;
    r.x += dx * k; r.z += dz * k;
    r.p.group.position.x = r.x;
    r.p.group.position.z = r.z;
    r.p.targetYaw = r.yaw;
    animateWalk(r.p, r.moving && Math.hypot(dx, dz) > 0.02, dt);
  }
  for (const r of remotosClientes.values()) {
    const dx = r.tx - r.x, dz = r.tz - r.z;
    r.x += dx * k; r.z += dz * k;
    r.p.group.position.x = r.x;
    r.p.group.position.z = r.z;
    r.p.targetYaw = r.yaw;
    r.p.marker.visible = monitorMode && r.furtou && r.state !== 'caught';
    animateWalk(r.p, Math.hypot(dx, dz) > 0.05, dt);
  }
  for (const r of remotosCarros.values()) {
    const dx = r.tx - r.x, dz = r.tz - r.z;
    r.x += dx * k; r.z += dz * k;
    r.g.position.set(r.x, 0, r.z);
    r.g.rotation.y = r.virando ? Math.PI / 2 : (r.dir > 0 ? 0 : Math.PI);
  }
}
function limparRemotosCenas() {
  for (const r of remotosClientes.values()) scene.remove(r.p.group);
  for (const r of remotosCarros.values()) scene.remove(r.g);
  remotosClientes.clear();
  remotosCarros.clear();
}

function criarSala() {
  const nome = document.getElementById('nomeInput').value.trim();
  if (!nome) return erroMenu('Digite seu nome.');
  comConexao(() => criarSalaAgora(nome));
}
function criarSalaAgora(nome) {
  socket.emit('criar_sala', { nome }, (resp) => {
    if (resp.erro) return erroMenu(resp.erro);
    net.codigo = resp.codigo;
    net.isHost = true;
    net.id = socket.id;
    net.nome = nome;
    net.jogadores = [{ id: socket.id, nome, papel: 'seguranca', host: true }];
    telaLobby();
  });
}
function entrarSala() {
  const nome = document.getElementById('nomeInput').value.trim();
  const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
  if (!nome) return erroMenu('Digite seu nome.');
  if (!codigo) return erroMenu('Digite o código da sala.');
  comConexao(() => entrarSalaAgora(codigo, nome));
}
function entrarSalaAgora(codigo, nome) {
  socket.emit('entrar_sala', { codigo, nome, papel: 'seguranca' }, (resp) => {
    if (resp.erro) return erroMenu(resp.erro);
    net.codigo = resp.codigo;
    net.isHost = false;
    net.id = socket.id;
    net.nome = nome;
    (resp.fotos || []).reverse().forEach(adicionarFoto);
    telaLobby();
  });
}
function telaLobby() {
  state = 'lobby';
  ov.style.display = 'flex';
  ov.innerHTML = `
    <h1>Sala de espera</h1>
    <p>Código da sala:</p>
    <div class="codigo">${net.codigo}</div>
    <p>Compartilhe o código com os seguranças.</p>
    <ul id="listaJogadores"></ul>
    ${net.isHost
      ? '<button id="btnIniciar" disabled>Iniciar partida</button>'
      : '<p>Aguardando o anfitrião iniciar a partida...</p>'}
    <button id="btnSair" class="sec">Sair</button>`;
  document.getElementById('btnSair').onclick = () => location.reload();
  if (net.isHost) document.getElementById('btnIniciar').onclick = () => socket.emit('iniciar');
  renderLobby();
}
function renderLobby() {
  const ul = document.getElementById('listaJogadores');
  if (!ul) return;
  ul.innerHTML = net.jogadores.map((j) =>
    `<li>${j.papel === 'celular' ? '📱' : '🛡️'} ${escapeHtml(j.nome)}${j.host ? ' (anfitrião)' : ''}</li>`).join('');
  const btn = document.getElementById('btnIniciar');
  if (btn) btn.disabled = !modelsReady;
}
function telaFim(pl) {
  state = 'over';
  ov.style.display = 'flex';
  const linhas = pl.map((j) => `<tr><td>${escapeHtml(j.nome)}</td><td>${j.pontos}</td><td>${j.furtos || 0}</td></tr>`).join('');
  ov.innerHTML = `
    <h1>Fim de turno</h1>
    <table><tr><th>Segurança</th><th>Pontos</th><th>Furtos pegos</th></tr>${linhas}</table>
    <button id="btnSair">Voltar ao menu</button>`;
  document.getElementById('btnSair').onclick = () => location.reload();
}

// ---------- Início / fim da partida ----------
function resetGame() {
  for (const c of [...customers]) removeCustomer(c);
  for (const car of [...cars]) removeCar(car);
  limparRemotosCenas();
  player.x = -27; player.z = 0; player.yaw = Math.PI;
  monitorMode = false; camIndex = 0;
  spawnTimer = 0; carSpawnTimer = 0;
  timeLeft = GAME_TIME;
  resetCaixa();
}
let timeLeft = GAME_TIME;
function startGame() {
  if (!modelsReady) return;
  resetGame();
  state = 'playing';
  ov.style.display = 'none';
  if (net.isHost) {
    sessaoId = `${net.codigo}@${new Date().toISOString()}`;
    scores = {};
    for (const j of net.jogadores) {
      if (j.papel === 'seguranca') scores[j.id] = { nome: j.nome, pontos: 0, furtos: 0, escapes: 0 };
    }
  }
  updateHud();
}
function finalizarPartida() {
  const pl = placarAtual();
  emitir('fim', { placar: pl });
  finalizarLocal(pl);
}
function finalizarLocal(pl) {
  monitorMode = false;
  placar = pl;
  telaFim(pl);
}
function simular(dt) {
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finalizarPartida(); return; }
  spawnTimer -= dt;
  if (spawnTimer <= 0 && customers.length < MAX_CUSTOMERS) {
    spawnCustomer();
    spawnTimer = 2 + Math.random() * 2;
  }
  carSpawnTimer -= dt;
  if (carSpawnTimer <= 0 && cars.length < MAX_CARS) {
    spawnCar();
    carSpawnTimer = 2.5 + Math.random() * 2;
  }
  for (const c of [...customers]) updateCustomer(c, dt);
  updateCars(dt);
  updateHud();
}

// ---------- Socket ----------
socket.on('jogadores', (lista) => {
  net.jogadores = lista;
  if (state === 'lobby') renderLobby();
});
socket.on('iniciar', () => startGame());
socket.on('posicao', (d) => atualizarPosicaoRemota(d));
socket.on('snapshot', (s) => aplicarSnapshot(s));
socket.on('evento', (e) => tratarEvento(e));
socket.on('foto', (f) => adicionarFoto(f));
socket.on('acao', (a) => { if (net.isHost && a.tipo === 'abordar') abordar(a.de, a.alvo); });
socket.on('saiu', (d) => removerRemoto(d.id));
socket.on('sala_encerrada', (d) => {
  ov.style.display = 'flex';
  ov.innerHTML = `<h1>Sala encerrada</h1><p>${escapeHtml(d.motivo)}</p><button id="btnSair">Voltar ao menu</button>`;
  document.getElementById('btnSair').onclick = () => location.reload();
  state = 'over';
});
socket.on('connect', () => { net.id = socket.id; });

// ---------- Carregamento dos modelos ----------
const gltfLoader = new GLTFLoader();
const loadModel = (name) => new Promise((resolve, reject) =>
  gltfLoader.load(`/static/models/${name}.glb`, (g) => resolve(g.scene), undefined, reject));

Promise.all(MODEL_NAMES.map(loadModel))
  .then((scenes) => {
    MODEL_NAMES.forEach((n, i) => { templates[n] = scenes[i]; });
    rigLimbs(templates.guard);
    rigLimbs(templates.customer);
    buildWorld();
    playerView = buildPerson('guard', 0x1e88e5);
    playerView.group.position.set(player.x, 0, player.z);
    playerView.group.rotation.y = player.yaw;
    playerView.targetYaw = player.yaw;
    playerView.rate = PLAYER_SPEED * 2.6;
    scene.add(playerView.group);
    modelsReady = true;
    if (state === 'lobby') renderLobby();
  })
  .catch((err) => {
    ov.innerHTML = `<h1>Erro</h1><p>Não foi possível carregar os modelos: ${escapeHtml(err.message)}</p>`;
  });

telaMenu();

// ---------- Loop ----------
const clock = new THREE.Clock();
let snapTimer = 0;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'playing') {
    updateLight(dt);
    if (!monitorMode) updatePlayer(dt);
    enviarPosicao(dt);
    if (net.isHost) {
      simular(dt);
      snapTimer += dt;
      if (snapTimer >= 0.1) {
        snapTimer = 0;
        socket.emit('snapshot', montarSnapshot());
      }
    } else {
      updateHud();
    }
  } else {
    updateLight(dt);
  }
  atualizarRemotos(dt);
  updateFlashes(dt);
  updateScreens();
  updateCamera();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);
</script>
</body>
</html>
